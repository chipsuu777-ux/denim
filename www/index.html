<style>
:root{--bg:#090c11;--card:#10151c;--card2:#161d27;--line:#1e2733;--tx:#f2f5f9;--mu:#7d8999;--ac:#4f8cff;--up:#2fbf71;--dn:#e5484d;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
html,body{margin:0;color:var(--tx);font-family:-apple-system,"SF Pro Display","Segoe UI",Roboto,sans-serif;min-height:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
.app{max-width:480px;margin:0 auto;padding:14px 16px 100px}
.top{display:flex;align-items:center;gap:6px;margin-bottom:26px}
.av img{width:100%;height:100%;object-fit:cover;display:block}
.av{overflow:hidden;width:34px;height:34px;border-radius:50%;background:linear-gradient(145deg,#2a3547,#141b26);border:1px solid var(--line);display:grid;place-items:center;font-size:15px;margin-right:4px}
.pill{border:0;background:transparent;color:var(--mu);font:600 14px -apple-system,sans-serif;padding:8px 14px;border-radius:20px;transition:background .25s,color .25s,transform .15s}
.pill:active{transform:scale(.94)}
.pill.on{background:#18233a;color:#8db4ff}
.name{color:var(--mu);font-size:13px;font-weight:600}
.bal{font-size:42px;font-weight:700;letter-spacing:-1.2px;margin:4px 0 8px;font-variant-numeric:tabular-nums;cursor:pointer;display:inline-block;transition:color .5s}
.bal.fu{color:#7ee2a8;transition:none}.bal.fd{color:#ff8b8f;transition:none}
.chg{display:flex;gap:8px;align-items:center;font-weight:600;font-size:14px;font-variant-numeric:tabular-nums}
.b{padding:2px 8px;border-radius:6px;font-size:12px}
.up{color:var(--up)}.dn{color:var(--dn)}
.b.up{background:#12301f}.b.dn{background:#3a171a}
.row{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:13px 14px;display:flex;align-items:center;gap:12px;margin-top:10px;transition:transform .18s,background .2s}
.row:active{transform:scale(.98);background:var(--card2)}
.row.cash{margin-top:26px;justify-content:space-between;font-weight:600}
.pop{opacity:0;animation:rowIn .5s cubic-bezier(.2,.8,.2,1) forwards;animation-delay:calc(var(--i,0)*70ms)}
@keyframes rowIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
h3{margin:28px 0 2px;font-size:17px;font-weight:700}
.ic{width:40px;height:40px;flex:none;border-radius:50%;overflow:hidden}
.ic svg{width:100%;height:100%;display:block}
.mid{flex:1;min-width:0}.mid b{display:block;font-size:15px;font-weight:600}.mid small{color:var(--mu);font-size:13px}
.sp{width:58px;height:26px;flex:none}
.sp path{fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.2s .3s ease-out forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.rt{text-align:right;font-variant-numeric:tabular-nums;min-width:96px}.rt b{display:block;font-size:15px;font-weight:600}.rt small{font-size:13px;font-weight:600}
.fl{animation:fl .7s}
@keyframes fl{0%{color:#9fe8bd}100%{color:inherit}}
.fab{position:fixed;right:max(18px,calc(50% - 222px));bottom:calc(24px + env(safe-area-inset-bottom,0px));width:54px;height:54px;border-radius:50%;border:0;background:var(--ac);color:#fff;font-size:26px;box-shadow:0 8px 24px #4f8cff40;transition:transform .2s}
.fab:active{transform:scale(.9) rotate(90deg)}
.tab{display:none}.tab.on{display:block;animation:tabIn .35s ease-out}
@keyframes tabIn{from{opacity:0;transform:translateX(10px)}to{opacity:1;transform:none}}
.empty{color:var(--mu);padding:60px 10px;text-align:center;line-height:1.5}
.sheet{position:fixed;inset:0;background:#000b;display:flex;align-items:flex-end;z-index:20;opacity:0;pointer-events:none;transition:opacity .25s}
.sheet.on{opacity:1;pointer-events:auto}
.panel{background:var(--card);border-top:1px solid var(--line);width:100%;max-width:480px;margin:0 auto;border-radius:22px 22px 0 0;padding:20px 16px calc(20px + env(safe-area-inset-bottom,0px));max-height:88%;overflow:auto;transform:translateY(40px);transition:transform .35s cubic-bezier(.2,.8,.2,1)}
.sheet.on .panel{transform:none}
.panel h2{margin:0 0 4px;font-size:19px}.panel p{margin:0 0 14px;color:var(--mu);font-size:13px}
.f{display:flex;align-items:center;gap:10px;margin:8px 0}
.f label{width:96px;font-weight:600;font-size:14px;display:flex;align-items:center;gap:8px}
.f label .ic{width:24px;height:24px}
input{flex:1;min-width:0;background:var(--card2);border:1px solid var(--line);color:#fff;border-radius:12px;padding:11px 12px;font:600 16px -apple-system,sans-serif}
input:focus{outline:2px solid var(--ac)}
.btn{width:100%;border:0;border-radius:14px;padding:14px;font:700 16px -apple-system,sans-serif;background:var(--ac);color:#fff;margin-top:14px;transition:transform .15s}
.btn:active{transform:scale(.97)}
.btn.g{background:var(--card2);color:#fff;margin-top:8px}
.hint{text-align:center;color:#3c4656;font-size:11px;margin-top:28px}
.wp{position:fixed;inset:0;z-index:-1;background:center/cover no-repeat;animation:wpIn .9s}.wp::after{content:"";position:absolute;inset:0;background:rgba(9,12,17,var(--dim,.45))}
@keyframes wpIn{from{opacity:0}to{opacity:1}}
body.hasw::before{background:transparent}
body.hasw .row{background:rgba(16,21,28,.6);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}
select{flex:1;min-width:0;background:var(--card2);border:1px solid var(--line);color:#fff;border-radius:12px;padding:11px 12px;font:600 16px -apple-system,sans-serif}
input[type=range]{padding:0;accent-color:var(--ac)}
label.btn{display:block;text-align:center}
.tbox{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px}
body.hasw .tbox{background:rgba(16,21,28,.6);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}
.est{color:var(--mu);font-size:13px;margin:6px 2px 10px;min-height:16px}
.mx{border:0;background:var(--card2);color:var(--ac);font:700 13px -apple-system,sans-serif;border-radius:10px;padding:12px}
.shake{animation:shake .4s}
@keyframes shake{25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:#1b2a44;border:1px solid #2a3f66;padding:12px 16px;border-radius:14px;font-size:14px;font-weight:600;opacity:0;transition:.35s;z-index:30;max-width:90%;text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}

.dtop{display:flex;align-items:center;gap:10px;margin-bottom:18px}.dtop .ic{width:32px;height:32px}.dtop b{font-size:17px}
.back{width:38px;height:38px;border-radius:50%;border:1px solid rgba(255,255,255,.22);background:rgba(255,255,255,.1);color:#fff;font-size:24px;line-height:1;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.dprice{font-size:38px;font-weight:700;letter-spacing:-1px;font-variant-numeric:tabular-nums}
.dchg{font-weight:700;font-size:15px;margin:2px 0 8px}
.chart{width:100%;height:230px;display:block;touch-action:none}
.cl{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.1s ease-out forwards}.area{animation:wpIn 1.3s}
.rngs{display:flex;justify-content:space-between;margin:10px 0 6px}
.rg{border:0;background:transparent;color:var(--mu);font:700 13px -apple-system,sans-serif;padding:8px 14px;border-radius:14px;transition:background .25s}.rg.on{background:rgba(255,255,255,.16);color:#fff}
.about{color:rgba(255,255,255,.72);line-height:1.55;font-size:15px;margin:8px 2px 18px}
.sheet.peek{background:transparent}.sheet.peek .panel{opacity:.18;transition:opacity .15s,transform .35s}
input[type=range]{touch-action:manipulation}
body .row,body .tot{text-shadow:0 1px 6px rgba(0,0,0,.4)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.pop{opacity:1}.sp path{stroke-dashoffset:0}}

function series(c,ri){
  const n=RG[ri][1],amp=RG[ri][2];
  let seed=c.t.charCodeAt(0)*131+c.t.charCodeAt(1)*17+ri*977+(c.t.charCodeAt(2)||5);

  const nz=[];let y=0;for(let k=0;k<n;k++){y+=r()-.5;nz.push(y)}
  const last=nz[n-1],p=pctOf(c)/100;
  const drift=ri===0?-p/(1+p):(r()-.5)*amp*1.5;
  return nz.map((v,k)=>Math.max(c.p*.05,c.p*(1+(v-last)*amp*.25+drift*(1-k/(n-1)))));
}

<div class="dchg" id="dChg" style="color:${col}">${sg(pc)}</div>
<svg id="dSvg" class="chart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">
<defs><linearGradient id="fg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${col}" stop-opacity=".35"/><stop offset="1" stop-color="${col}" stop-opacity="0"/></linearGradient></defs>
<path class="area" d="${line}L${W} ${H}L0 ${H}Z" fill="url(#fg)"/>
<path class="cl" pathLength="1" d="${line}" fill="none" stroke="${col}" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>
<line id="dLn" x1="0" x2="0" y1="0" y2="${H}" stroke="rgba(255,255,255,.45)" stroke-width="1" vector-effect="non-scaling-stroke" opacity="0"/></svg>
<div class="rngs">${RG.map((r,i)=>`<button class="rg${i===dR?" on":""}" data-r="${i}">${r[0]}</button>`).join("")}</div>
<h3>${DT[L][0]}</h3>
<div class="row"><div class="ic">${ICON[c.t]}</div><div class="mid"><b>${c.t}</b><small>${fmt(a,6)} ${c.t}</small></div><div class="rt"><b>${money(val)}</b><small class="${dd>=0?"up":"dn"}">${dd>=0?"+":"-"}${money(Math.abs(dd))}</small></div></div>
<h3>${DT[L][1]}${c.s}</h3><p class="about">${DESC[c.t][L]}</p>
<button class="btn" id="dTrade">${tr("trade")}</button></div>`;
  $("dBack").onclick=closeDetail;
  document.querySelectorAll(".rg").forEach(b=>b.onclick=()=>{dR=+b.dataset.r;drawDetail()});
  $("dTrade").onclick=()=>{closeDetail();document.querySelector('.pill[data-t="trade"]').click();$("trFrom").value=c.t;if($("trTo").value===c.t)$("trTo").selectedIndex=($("trFrom").selectedIndex+1)%BASE.length;trUpd()};
  const sv=$("dSvg"),ln=$("dLn");
  const mv=e=>{const b=sv.getBoundingClientRect(),k=Math.max(0,Math.min(n-1,Math.round((e.clientX-b.left)/b.width*(n-1))));
    ln.setAttribute("x1",X(k));ln.setAttribute("x2",X(k));ln.setAttribute("opacity",1);
    $("dPrice").textContent=money(V[k]);$("dChg").textContent=sg((V[k]/first-1)*100)};
  const en=()=>{ln.setAttribute("opacity",0);$("dPrice").textContent=money(last);$("dChg").textContent=sg(pc)};
  sv.addEventListener("pointerdown",mv);sv.addEventListener("pointermove",mv);sv.addEventListener("pointerup",en);sv.addEventListener("pointerleave",en);sv.addEventListener("pointercancel",en);
}
$("list").onclick=e=>{const r=e.target.closest(".row");if(r&&r.dataset.t)openDetail(r.dataset.t)};
$("inCur").onchange=()=>{const c=$("inCur").value;$("inRate").value=c==="USD"?1:(S.rates[c]||1)};

function persist(){try{localStorage.setItem("fw3",JSON.stringify(S))}catch(e){}}
function sheetOpen(){return $("sheet").classList.contains("on")}
function readForm(){
  S.name=$("inName").value||"Denim";S.lang=$("inLang").value;S.dm=num($("inDim").value)/100;S.gl=num($("inGl").value)/100;
  S.cur=$("inCur").value;if(S.cur!=="USD")S.rates[S.cur]=num($("inRate").value)||S.rates[S.cur];
  S.cash=num($("inCash").value);S.chg=num($("inChg").value);
  document.querySelectorAll("#coins input").forEach(i=>S.a[i.dataset.t]=num(i.value));
}
function closeSheet(){if(sheetOpen()){readForm();persist();$("sheet").classList.remove("on");full()}}
const autoSave=()=>{if(sheetOpen()){readForm();persist()}};
$("sheet").addEventListener("input",autoSave);
$("sheet").addEventListener("change",autoSave);
window.addEventListener("pagehide",()=>{autoSave();persist()});
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="hidden"){autoSave();persist()}});

["inGl","inDim"].forEach(id=>{const on=()=>$("sheet").classList.add("peek");$(id).addEventListener("pointerdown",on);$(id).addEventListener("touchstart",on,{passive:true})});
const peekOff=()=>$("sheet").classList.remove("peek");
["pointerup","pointercancel","touchend","touchcancel"].forEach(ev=>window.addEventListener(ev,peekOff));

full();setInterval(tick,3000);
</script>
</body>
</html>
